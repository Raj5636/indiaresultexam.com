<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Date Parsing Test</title>
</head>
<body>
  <h2>Date Parsing Results</h2>
  <div id="output" style="font-family: monospace; white-space: pre; font-size: 14px;">Testing...</div>
  <script>
    const parseToDate = (str) => {
      if (!str) return null;
      const clean = String(str).trim();
      const dmy = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (dmy) {
        return new Date(parseInt(dmy[3], 10), parseInt(dmy[2], 10) - 1, parseInt(dmy[1], 10));
      }
      const parsed = Date.parse(clean);
      if (!isNaN(parsed)) return new Date(parsed);
      return null;
    };

    const startStr = "June 2026";
    const lastStr = "30/04/2026";
    const start = parseToDate(startStr);
    const last = parseToDate(lastStr);

    let html = "startStr = " + JSON.stringify(startStr) + "\n";
    html += "lastStr = " + JSON.stringify(lastStr) + "\n";
    html += "start = " + (start ? start.toString() + " (time: " + start.getTime() + ")" : "null") + "\n";
    html += "last = " + (last ? last.toString() + " (time: " + last.getTime() + ")" : "null") + "\n";
    html += "start > last = " + (start && last && start > last) + "\n";
    
    document.getElementById("output").innerText = html;
  </script>
</body>
</html>
